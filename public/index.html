<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#18181b" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>OnlyChat</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="vendor/hl-light.css" media="(prefers-color-scheme: light)">
<link rel="stylesheet" href="vendor/hl-dark.css" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="side-head">
      <button id="newChat" class="btn primary wide">＋ 新对话</button>
    </div>
    <input id="search" class="input" placeholder="搜索会话…" autocomplete="off">
    <nav id="chatList"></nav>
    <div class="side-foot">
      <button id="openAccount" class="btn ghost wide account-btn" title="账户"><span class="avatar" id="meAvatar">?</span><span id="meName" class="t">账户</span></button>
      <div class="foot-row">
        <button id="openSettings" class="btn ghost">⚙ 设置</button>
        <button id="openUsage" class="btn ghost">📊 用量</button>
      </div>
    </div>
  </aside>
  <div id="scrim"></div>
  <main id="main">
    <header id="topbar">
      <button id="toggleSide" class="icon-btn" title="会话列表">☰</button>
      <select id="modelSelect" class="input" title="模型"></select>
      <div class="top-spacer"></div>
      <div id="chatTitle"></div>
      <a id="exportChat" class="icon-btn" title="导出当前会话（JSON）" hidden>⤓</a>
    </header>
    <section id="messages"></section>
    <footer id="composer">
      <div id="editingBar" hidden><span>正在编辑消息，发送后将替换该消息及其后的内容</span><button id="cancelEdit" class="link">取消</button></div>
      <div id="attachments"></div>
      <div class="composer-box">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行；可粘贴/拖入图片"></textarea>
        <div class="composer-row">
          <button id="attachBtn" class="chip" title="上传图片">🖼 图片</button>
          <button id="searchToggle" class="chip toggle" title="使用 API 原生联网搜索">🌐 联网</button>
          <select id="thinkSelect" class="chip" title="思考强度（推理深度）"></select>
          <div class="top-spacer"></div>
          <button id="sendBtn" class="btn primary">发送</button>
        </div>
      </div>
      <input id="fileInput" type="file" accept="image/png,image/jpeg,image/webp,image/gif" multiple hidden>
    </footer>
  </main>
</div>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <div class="dlg-head"><h2>设置</h2><button class="icon-btn" value="cancel" formnovalidate>✕</button></div>
    <div class="dlg-body">
      <h3>我的 API 供应商</h3>
      <div id="providerList"></div>
      <div class="row-gap">
        <button type="button" class="btn" data-add="openai">＋ OpenAI 格式</button>
        <button type="button" class="btn" data-add="anthropic">＋ Anthropic 格式</button>
      </div>
      <p class="muted small">已保存的供应商不能删除，只能「停用」（停止使用，不再出现在模型列表）并可随时「恢复」；是否共享只能在创建时选择，之后不可更改。</p>
      <div id="sharedSec" hidden>
        <h3>他人共享的供应商（只读）</h3>
        <div id="sharedList"></div>
      </div>
      <h3>通用</h3>
      <label class="field"><span>标题生成模型</span><select id="titleModel" class="input"></select></label>
      <label class="field"><span>系统提示词</span><textarea id="systemPrompt" class="input" rows="3" placeholder="可留空"></textarea></label>
      <label class="field"><span>max_tokens（Anthropic 必填）</span><input id="maxTokens" class="input" type="number" min="256" max="200000"></label>
    </div>
    <div class="dlg-foot"><span id="settingsMsg" class="muted"></span><button class="btn" value="cancel" formnovalidate>取消</button><button id="saveSettings" class="btn primary" value="save">保存</button></div>
  </form>
</dialog>

<dialog id="loginDlg">
  <form id="loginForm">
    <div class="dlg-head"><h2>OnlyChat</h2></div>
    <div class="dlg-body">
      <label class="field"><span>用户名</span><input id="loginUser" class="input" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <label class="field"><span>密码</span><input id="password" class="input" type="password" autocomplete="current-password" required></label>
      <div id="loginMsg" class="err"></div>
    </div>
    <div class="dlg-foot"><button class="btn primary">登录</button></div>
  </form>
</dialog>

<dialog id="accountDlg">
  <div class="dlg-form">
    <div class="dlg-head"><h2>账户</h2><button type="button" class="icon-btn" id="accClose">✕</button></div>
    <div class="dlg-body">
      <div class="acc-who"><span class="avatar big" id="accAvatar"></span><div><div id="accName" class="acc-name"></div><div id="accRole" class="muted small"></div></div><button type="button" id="logoutBtn" class="btn danger-o">退出登录</button></div>

      <h3>修改密码</h3>
      <form id="pwForm" autocomplete="off">
        <input type="text" autocomplete="username" hidden>
        <label class="field"><span>当前密码</span><input id="pwCur" class="input" type="password" autocomplete="current-password" required></label>
        <label class="field"><span>新密码</span><input id="pwNew" class="input" type="password" autocomplete="new-password" required></label>
        <label class="field"><span>确认新密码</span><input id="pwNew2" class="input" type="password" autocomplete="new-password" required></label>
        <div class="row-gap"><button class="btn primary">修改密码</button><span id="pwMsg" class="small"></span></div>
      </form>

      <h3>数据</h3>
      <div class="row-gap">
        <a id="exportAll" class="btn" href="/api/export" download>导出我的全部会话</a>
        <button type="button" id="importBtn" class="btn">导入会话…</button>
        <input id="importFile" type="file" accept="application/json,.json" hidden>
        <span id="dataMsg" class="small"></span>
      </div>
      <p class="muted small">导出为 JSON（含内嵌图片），导入使用同一格式；仅涉及你自己的会话。</p>

      <div id="adminSec" hidden>
        <h3>用户管理（管理员）</h3>
        <div id="userList" class="user-list"></div>
        <form id="newUserForm" class="new-user" autocomplete="off">
          <input id="nuName" class="input" placeholder="新用户名" autocomplete="off" autocapitalize="none" spellcheck="false" required>
          <input id="nuPw" class="input" placeholder="密码（留空则随机生成）" autocomplete="new-password">
          <button class="btn primary">创建用户</button>
        </form>
        <div id="nuResult" class="nu-result" hidden></div>
        <div id="adminMsg" class="small"></div>
      </div>
    </div>
  </div>
</dialog>

<dialog id="usageDlg" class="wide">
  <div class="dlg-form">
    <div class="dlg-head"><h2>共享密钥用量排行</h2><button type="button" class="icon-btn" id="usageClose">✕</button></div>
    <div class="dlg-body" id="usageBody"></div>
  </div>
</dialog>

<template id="providerTpl">
  <div class="provider">
    <div class="prov-row">
      <input class="input p-name" placeholder="名称">
      <select class="input p-type">
        <option value="openai">OpenAI · Chat Completions</option>
        <option value="openai-responses">OpenAI · Responses</option>
        <option value="anthropic">Anthropic · Messages</option>
      </select>
      <button type="button" class="btn p-toggle" title="停用后不再出现在模型列表，数据保留，可随时恢复">停用</button>
      <button type="button" class="icon-btn p-del" title="移除（尚未保存）">🗑</button>
    </div>
    <div class="prov-meta">
      <span class="badge p-badge"></span>
      <label class="p-share-pick">共享方式
        <select class="input p-shared"><option value="0">仅自己使用</option><option value="1">共享给所有用户使用</option></select>
      </label>
      <span class="muted small p-share-note">创建后不可更改；共享后其他用户可使用此 Key 调用模型，用量会计入排行。</span>
    </div>
    <input class="input p-base" placeholder="Base URL">
    <div class="prov-row">
      <input class="input p-key" type="password" autocomplete="off" placeholder="API Key">
      <button type="button" class="btn p-reveal" title="仅你本人可查看">显示 Key</button>
    </div>
    <div class="prov-row p-secret-row" hidden><input class="input mono p-secret" readonly><button type="button" class="btn p-secret-hide">隐藏</button></div>
    <div class="prov-row">
      <textarea class="input p-models" rows="3" placeholder="模型 ID，每行一个"></textarea>
      <button type="button" class="btn p-fetch">拉取模型</button>
    </div>
    <details>
      <summary>高级：自定义请求参数</summary>
      <label class="field"><span>附加请求体 JSON（每次请求合并）</span><textarea class="input mono p-extra" rows="2" placeholder='{"top_p": 0.9}'></textarea></label>
      <label class="field"><span>联网时附加的请求体 JSON（覆盖默认联网参数）</span><textarea class="input mono p-search" rows="2"></textarea></label>
      <p class="muted small p-hint"></p>
    </details>
  </div>
</template>

<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="app.js"></script>
</body>
</html>
